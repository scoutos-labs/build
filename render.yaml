services:
  - type: web
    name: build
    runtime: static
    envVars:
      - key: GLEAM_VERSION
        value: 1.16.0
      # Phase 5 rollout switch, flipped on 2026-07-28. Managed mode: users sign
      # in with Clerk and the server provisions a per-user OpenRouter key, so
      # nobody pastes their own.
      #
      # ROLLBACK is this value back to "false" — one deploy, no data migration
      # (projects live in IndexedDB and are untouched either way).
      #
      # Two things must be true in the dashboards or this is not what it looks
      # like: VITE_CLERK_PUBLISHABLE_KEY must be set below — unset silently
      # falls back to BYOK, because isManagedAuthEnabled() requires BOTH — and
      # Google must be enabled as a Clerk social connection, which on a
      # production instance needs your own Google OAuth credentials rather than
      # Clerk's shared development ones.
      - key: VITE_MANAGED_AUTH
        value: "true"
        previewValue: "true"
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
    previews:
      generation: automatic
    buildCommand: |
      set -euo pipefail
      mkdir -p .render/bin
      curl -fsSL "https://github.com/gleam-lang/gleam/releases/download/v${GLEAM_VERSION}/gleam-v${GLEAM_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
        | tar -xz -C .render/bin gleam
      chmod +x .render/bin/gleam
      export PATH="$PWD/.render/bin:$PATH"
      gleam --version
      npm ci
      mkdir -p node_modules/.bin
      ln -sf "$PWD/.render/bin/gleam" node_modules/.bin/gleam
      npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
    routes:
      # Same-origin proxy to the API service: no CORS, and Clerk's __session
      # cookie works as a fallback to the Authorization header.
      # SECURITY: onrender.com subdomains are global. After the first deploy,
      # verify the API service's actual URL in the Render dashboard and update
      # these destinations if it differs — a mismatched name would proxy
      # authenticated traffic to whoever owns that subdomain.
      - type: rewrite
        source: /api/*
        destination: https://hyper-build-api.onrender.com/api/*
      - type: rewrite
        source: /webhooks/*
        destination: https://hyper-build-api.onrender.com/webhooks/*

  - type: web
    name: hyper-build-api
    runtime: node
    # Disks require a paid instance; previews stay off for this service (PR
    # previews of the frontend point at this production API, which is inert
    # until VITE_MANAGED_AUTH is on).
    plan: starter
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # Embedded PGlite persists to this disk. Disks pin the service to a single
    # instance and disable zero-downtime deploys — fine at this scale.
    disk:
      name: build-api-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SIGNING_SECRET
        sync: false
      - key: OPENROUTER_PROVISIONING_KEY
        sync: false
      - key: KEY_ENCRYPTION_SECRET
        generateValue: true
      - key: PGLITE_DATA_DIR
        value: /var/data/pglite
      # Optional. Without it web_search reports itself unavailable rather than
      # returning nothing — web_fetch and web_post are unaffected. Keyless
      # DuckDuckGo is deliberately NOT the fallback here: it would scrape from
      # this service's shared egress IP, so throttling would hit every user at
      # once (set BUILD_ALLOW_KEYLESS_SEARCH=1 only if you accept that).
      - key: BRAVE_SEARCH_API_KEY
        sync: false
